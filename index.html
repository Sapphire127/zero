<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简单移动方块</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #2c3e50;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
      }

      .container {
        text-align: center;
      }

      h1 {
        color: #ecf0f1;
        margin-bottom: 20px;
      }

      canvas {
        border: 3px solid #3498db;
        background: #34495e;
      }

      .instructions {
        color: #bdc3c7;
        margin-top: 15px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>移动方块</h1>
      <canvas id="gameCanvas" width="600" height="400"></canvas>
      <div class="instructions">使用方向键或WASD键移动方块</div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
